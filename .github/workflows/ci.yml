name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in the root package.json (pnpm 10),
      # so it can never drift from what developers run locally.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Caches the pnpm store keyed on pnpm-lock.yaml.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: gitdocs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name gitdocs-ci -p 4000:4000 \
            -e GITDOCS_API_TOKENS=ci-token \
            gitdocs:ci
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' gitdocs-ci)" = "healthy" ]; then
              echo "container is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "container never became healthy"
          docker logs gitdocs-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs gitdocs-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f gitdocs-ci || true
