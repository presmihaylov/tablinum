name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in the root package.json (pnpm 10),
      # so it can never drift from what developers run locally.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Caches the pnpm store keyed on pnpm-lock.yaml.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e (webdriverio)
    runs-on: ubuntu-latest
    # The suite runs on one worker against one server, so it is serial by design. 25 minutes
    # covers a cold build plus the whole run, with room for the CI retry of a flaky test.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Same two setup steps as the build job: the pnpm version comes from "packageManager",
      # and the store is cached on pnpm-lock.yaml.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner image ships Google Chrome with the chromedriver of the same version, so the
      # suite downloads no browser. Printing both versions makes a mismatch obvious.
      - name: Point the suite at the runner's Chrome
        run: |
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version

      # The suite serves apps/web/dist out of apps/server/dist, so both must exist first.
      - name: Build
        run: pnpm build

      - name: Run the e2e suite
        run: pnpm e2e

      # A failed test leaves a screenshot of its page.
      - name: Upload the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: tablinum:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name tablinum-ci -p 4000:4000 \
            -e TABLINUM_API_TOKENS=ci-token \
            tablinum:ci
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' tablinum-ci)" = "healthy" ]; then
              echo "container is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "container never became healthy"
          docker logs tablinum-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs tablinum-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f tablinum-ci || true
