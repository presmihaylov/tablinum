name: Deploy

# Builds the image in CI and tells apps-01 to run it. The host never builds:
# it is a cx23, and this Dockerfile compiles better-sqlite3 from source.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy in flight. A half-applied deploy is worse than a slow one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: build, push, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only. apps-01 is amd64 and an arm64 build would need QEMU.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Secrets go through env, never through ${{ }} inside the script. A
      # ${{ }} is substituted into the script text before the shell runs, which
      # both leaks the value under shell tracing and allows injection.
      - name: Deploy to apps-01
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          # printf, not echo: OpenSSH rejects a key file with no trailing newline.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -p 4423 "apps@$HOST" "appctl deploy gitdocs $TAG"

      - name: Wipe the key
        if: always()
        run: rm -f ~/.ssh/deploy
